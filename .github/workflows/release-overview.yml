name: Release overview

# Attaches the feature overview (docs/OVERVIEW.md, docs/OVERVIEW.de.md of the
# default branch) to an existing release, replacing older copies, and updates
# the release text from .github/releases/<tag>.md. New releases get both from
# the Build workflow; this is for corrections afterwards.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v1.2.8)
        required: true
      notes_only:
        description: Only update title and text (no assets; for older releases)
        type: boolean
        default: false

env:
  FW_NAME: XT                    # file names
  DISPLAY_NAME: XT for LXR-02    # release titles

jobs:
  attach:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Attach the overview
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES_ONLY: ${{ inputs.notes_only }}
        run: |
          if [ "$NOTES_ONLY" = "true" ]; then
            gh release edit "$TAG" --title "$DISPLAY_NAME $TAG" --notes-file ".github/releases/$TAG.md" -R "$GITHUB_REPOSITORY"
            exit 0
          fi
          mkdir -p out
          cp docs/OVERVIEW.md "out/${FW_NAME}_Overview_EN.md"
          cp docs/OVERVIEW.de.md "out/${FW_NAME}_Overview_DE.md"
          for f in docs/images/*.svg; do cp "$f" "out/${FW_NAME}_$(basename "$f")"; done
          cp docs/XT_Manual_Supplement.pdf docs/XT_Manual_Supplement.de.pdf out/
          gh release upload "$TAG" out/*.md out/*.svg out/*.pdf --clobber -R "$GITHUB_REPOSITORY"
          if [ -f ".github/releases/$TAG.md" ]; then
            gh release edit "$TAG" --title "$DISPLAY_NAME $TAG" --notes-file ".github/releases/$TAG.md" -R "$GITHUB_REPOSITORY"
          fi
